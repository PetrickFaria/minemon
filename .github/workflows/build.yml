name: Build Minemon
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare one audited Kanto batch
        id: batch
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[prepare-gen1-batch]') }}
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.1.0
          python3 tools/prepare_next_batch.py --size 5
      - name: Verify extracted project resources
        run: python3 tools/verify_project.py
      - name: Ensure Gradle Wrapper is executable
        run: chmod +x gradlew
      - name: Report resolved ForgeGradle version
        run: ./gradlew --no-daemon buildEnvironment
      - name: Build and run tests
        id: compile
        run: ./gradlew --no-daemon clean test build
      - name: Run Minecraft server behavior tests
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          timeout 360s ./gradlew --no-daemon runGameTestServer
      - name: Capture runtime API diagnostics
        if: always()
        run: python3 tools/collect_diagnostics.py
      - name: Upload server behavior logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minemon-server-tests
          path: |
            run/logs/
            build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Launch Minecraft client and validate GeckoLib cache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          python3 tools/prepare_client_world.py
          timeout 420s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest
          grep -F 'PASS WORLD' run/client-validation.txt
          grep -F 'PASS COMBAT' run/client-validation.txt
          grep -F 'PASS LOCOMOTION' run/client-validation.txt
          grep -F 'PASS ROSTER' run/client-validation.txt
      - name: Verify executable mod JAR contents
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'Minemon-1.19.2-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fx 'META-INF/ASSET_LICENSES.md'
          jar tf "$jar_file" | grep -Fx 'pack.mcmeta'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/Minemon.class'
          jar tf "$jar_file" | grep -Fx 'data/minemon/species_catalog.json'
          jar tf "$jar_file" | grep -Fx 'data/minemon_gen1/pokedex.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/bulbasaur/bulbasaur.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/bulbasaur/bulbasaur.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/bulbasaur/bulbasaur.animation.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/item/bulbasaur_spawn_egg.json'
          python3 tools/verify_runtime.py "$jar_file"
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'modId="minemon_gen1"'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'versionRange="[1.19.2,1.20)"'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'modId="geckolib3"'
          unzip -p "$jar_file" META-INF/ASSET_LICENSES.md | grep -F 'CC BY-NC 3.0'
          unzip -p "$jar_file" assets/minemon_gen1/models/item/bulbasaur_spawn_egg.json | grep -F 'minecraft:item/template_spawn_egg'
          unzip -p "$jar_file" pack.mcmeta | grep -F '"pack_format": 9'
      - name: Publish validated batch commit
        id: publish_batch
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[prepare-gen1-batch]') && steps.batch.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/candidate_audit.json
          git add src/main/resources/data/minemon_gen1/runtime_species.json
          git add src/main/resources/data/minemon_gen1/pokedex.json
          git add src/main/resources/assets/minemon/lang/en_us.json src/main/resources/assets/minemon/lang/pt_br.json
          git add src/main/resources/assets/minemon/models/item/
          git add gradle.properties
          batch="${{ steps.batch.outputs.slugs }}"
          git commit -m "Add audited Kanto batch: $batch"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Validated batch commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Minemon JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minemon-1.19.2-2.0.0-gen1
          path: build/libs/Minemon-1.19.2-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Collect diagnostics
        if: always()
        run: python3 tools/collect_diagnostics.py
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minemon-test-diagnostics
          path: |
            run/logs/
            run/client-validation.txt
            run/screenshots/
            build/test-results/
            build/diagnostics/
          retention-days: 7
