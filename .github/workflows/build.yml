name: Build Minemon
on:
  push:
    paths-ignore: [".github/workflows/cobblemon-source-audit.yml", ".github/workflows/prepare-cobblemon-batch.yml", "tools/import_cobblemon_182_batch.py", "docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify extracted project resources
        run: python3 tools/verify_project.py
      - name: Preflight active animation Molang compatibility
        run: python3 tools/verify_molang_compatibility.py
      - name: Verify batches 8 to 15, prior assets, and Pidge wing rigs
        run: |
          git fetch --no-tags --depth=1 origin b77eac9c38aa0d6a1d35c3cfab36a707ac6cab24
          git fetch --no-tags --depth=1 origin 2503dd085402211ec2e9c6287fca83ab4747d2d5
          git fetch --no-tags --depth=1 origin eeb3054e6b461dbd713d28029a717f31fa098492
          git fetch --no-tags --depth=1 origin b7b81592f4e2e0097a32f9342e3890f7257182e5
          git fetch --no-tags --depth=1 origin 0816533addee80e9e17a684c94bed399f4a9488f
          git fetch --no-tags --depth=1 origin 364fab1caf136d2e645f6ca77c4199570230eabd
          git fetch --no-tags --depth=1 origin c91e12ac3067317f97898a16f5deec3bfa919277
          git fetch --no-tags --depth=1 origin 76fcb3074cc65c62dea6b94c291de90925494e95
          python3 tools/verify_batch8.py
          python3 tools/verify_batch9.py
          python3 tools/verify_batch10.py
          python3 tools/verify_batch11.py
          python3 tools/verify_batch12.py
          python3 tools/verify_batch13.py
          python3 tools/verify_batch14.py
          python3 tools/verify_batch15.py
          python3 tools/verify_batch16.py
          python3 tools/verify_pidge_wing_visibility.py
      - name: Ensure Gradle Wrapper is executable
        run: chmod +x gradlew
      - name: Run focused species selection and active Molang tests
        run: ./gradlew --no-daemon test --tests 'br.com.petrickfaria.minemon.gametest.SmokeSpeciesSelectionTest' --tests 'br.com.petrickfaria.minemon.gametest.ActiveAnimationMolangPreflightTest' --tests 'br.com.petrickfaria.minemon.Batch10AnimationCompatibilityTest' --tests 'br.com.petrickfaria.minemon.Batch11AnimationCompatibilityTest' --tests 'br.com.petrickfaria.minemon.Batch12AnimationCompatibilityTest' --tests 'br.com.petrickfaria.minemon.Batch13AnimationCompatibilityTest' --tests 'br.com.petrickfaria.minemon.Batch14AnimationCompatibilityTest' --tests 'br.com.petrickfaria.minemon.Batch15AnimationCompatibilityTest'
      - name: Report ForgeGradle and build/run tests
        id: compile
        run: ./gradlew --no-daemon buildEnvironment clean test build
      - name: Run Minecraft server behavior tests
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          python3 tools/prepare_gametest_world.py
          timeout 480s ./gradlew --no-daemon runGameTestServer
      - name: Capture runtime API diagnostics
        if: always()
        run: python3 tools/collect_diagnostics.py
      - name: Upload server behavior logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minemon-server-tests
          path: |
            run/logs/
            build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Launch Minecraft client and validate GeckoLib cache
        if: ${{ success() && steps.compile.outcome == 'success' }}
        run: |
          python3 tools/prepare_client_world.py
          set +e
          timeout --kill-after=30s 5400s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 0 ]; then
            if [ "$smoke_status" -eq 124 ]; then
              echo "[CLIENT SMOKE] FAIL timeout after 5400s; last phase and species progress follow."
            else
              echo "[CLIENT SMOKE] FAIL exit=$smoke_status; no automatic full-client retry will be started."
            fi
            tail -n 120 run/client-validation.txt 2>/dev/null || true
            tail -n 160 run/logs/latest.log 2>/dev/null || true
            exit "$smoke_status"
          fi
          grep -F 'PASS WORLD' run/client-validation.txt
          grep -F 'PASS COMBAT' run/client-validation.txt
          grep -F 'PASS LOCOMOTION' run/client-validation.txt
          grep -F 'PASS ROSTER' run/client-validation.txt
          grep -F 'PASS CHARMANDER TAIL FLAME' run/client-validation.txt
          grep -F 'PASS CHARMELEON TAIL FLAME' run/client-validation.txt
          grep -F 'PASS CHARIZARD TAIL FLAME' run/client-validation.txt
          grep -F 'PASS PONYTA/RAPIDASH FIRE OVERLAYS' run/client-validation.txt
          grep -F 'PASS FIRE-STARTER ARMS' run/client-validation.txt
          grep -F 'PASS PIDGE WINGS' run/client-validation.txt
          grep -F 'PASS SOURCE LOOK' run/client-validation.txt
          grep -F 'PASS SOURCE PITCH' run/client-validation.txt
          grep -F 'PASS SOURCE PITCH: mew source q.pitch_tilt input moves the body bone:' run/client-validation.txt
          grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
      - name: Validate mixed flight and Vaporeon swimming on the real client
        run: |
          cp run/client-validation.txt run/client-validation-full.txt
          for scenario in air water; do
            python3 tools/prepare_client_world.py
            if [ "$scenario" = air ]; then
              timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeAir -PclientSmokeSpecies=charizard,scyther
            else
              timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeWater -PclientSmokeSpecies=vaporeon
            fi
            grep -F 'PASS ROSTER' run/client-validation.txt
            grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
            cp run/client-validation.txt "run/client-validation-$scenario.txt"
          done
      - name: Verify executable mod JAR contents
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'Minemon-1.19.2-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fx 'META-INF/ASSET_LICENSES.md'
          jar tf "$jar_file" | grep -Fx 'pack.mcmeta'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/Minemon.class'
          jar tf "$jar_file" | grep -Fx 'data/minemon/species_catalog.json'
          jar tf "$jar_file" | grep -Fx 'data/minemon_gen1/pokedex.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/bulbasaur_cobblemon_1_8_2/bulbasaur.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/bulbasaur_cobblemon_1_8_2/bulbasaur.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/bulbasaur_cobblemon_1_8_2/bulbasaur.animation.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/item/bulbasaur_spawn_egg.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/lapras_cobblemon_1_8_2/lapras.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/lapras_cobblemon_1_8_2/lapras.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/lapras_cobblemon_1_8_2/lapras.animation.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/aerodactyl_cobblemon_1_8_2/aerodactyl.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/moltres_cobblemon_1_8_2/moltres.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/dragonair_cobblemon_1_8_2/dragonair.animation.json'
          python3 tools/verify_runtime.py "$jar_file"
          python3 tools/verify_batch8.py "$jar_file"
          python3 tools/verify_batch9.py "$jar_file"
          python3 tools/verify_batch10.py "$jar_file"
          python3 tools/verify_batch11.py "$jar_file"
          python3 tools/verify_batch12.py "$jar_file"
          python3 tools/verify_batch13.py "$jar_file"
          python3 tools/verify_batch14.py "$jar_file"
          python3 tools/verify_batch15.py "$jar_file"
          python3 tools/verify_batch16.py "$jar_file"
          python3 tools/verify_pidge_wing_visibility.py "$jar_file"
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'modId="minemon_gen1"'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'versionRange="[1.19.2,1.20)"'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'modId="geckolib3"'
          unzip -p "$jar_file" META-INF/ASSET_LICENSES.md | grep -F 'CC BY-NC 3.0'
          unzip -p "$jar_file" assets/minemon_gen1/models/item/bulbasaur_spawn_egg.json | grep -F 'minecraft:item/template_spawn_egg'
          unzip -p "$jar_file" pack.mcmeta | grep -F '"pack_format": 9'
      - name: Upload Minemon JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minemon-1.19.2-2.0.0-gen1
          path: build/libs/Minemon-1.19.2-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Collect diagnostics
        if: always()
        run: python3 tools/collect_diagnostics.py
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minemon-test-diagnostics
          path: |
            run/logs/
            run/client-validation*.txt
            run/screenshots/
            build/test-results/
            build/diagnostics/
          retention-days: 7
