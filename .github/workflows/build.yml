name: Build Minemon
on:
  push:
    paths-ignore: [".github/workflows/cobblemon-source-audit.yml", ".github/workflows/prepare-cobblemon-batch.yml", "tools/import_cobblemon_182_batch.py", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full legacy movement, sleep, audio, and GameTest suite
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify extracted project resources
        run: python3 tools/verify_project.py
      - name: Verify Rocket workstation and villager resources
        run: python3 tools/verify_rocket.py
      - name: Verify Pokémon treat models, textures, and translations
        run: python3 tools/verify_treats.py
      - name: Verify PokéCoin registration and resources
        run: python3 tools/verify_poke_coin.py
      - name: Verify Pokébola registration and resources
        run: python3 tools/verify_pokeball.py
      - name: Preflight active animation Molang compatibility
        run: python3 tools/verify_molang_compatibility.py
      - name: Verify batches 8 to 15, prior assets, and Pidge wing rigs
        run: |
          git fetch --no-tags --depth=1 origin b77eac9c38aa0d6a1d35c3cfab36a707ac6cab24
          git fetch --no-tags --depth=1 origin 2503dd085402211ec2e9c6287fca83ab4747d2d5
          git fetch --no-tags --depth=1 origin eeb3054e6b461dbd713d28029a717f31fa098492
          git fetch --no-tags --depth=1 origin b7b81592f4e2e0097a32f9342e3890f7257182e5
          git fetch --no-tags --depth=1 origin 0816533addee80e9e17a684c94bed399f4a9488f
          git fetch --no-tags --depth=1 origin 364fab1caf136d2e645f6ca77c4199570230eabd
          git fetch --no-tags --depth=1 origin c91e12ac3067317f97898a16f5deec3bfa919277
          git fetch --no-tags --depth=1 origin 76fcb3074cc65c62dea6b94c291de90925494e95
          python3 tools/verify_batch8.py
          python3 tools/verify_batch9.py
          python3 tools/verify_batch10.py
          python3 tools/verify_batch11.py
          python3 tools/verify_batch12.py
          python3 tools/verify_batch13.py
          python3 tools/verify_batch14.py
          python3 tools/verify_batch15.py
          python3 tools/verify_batch16.py
          python3 tools/verify_pidge_wing_visibility.py
      - name: Ensure Gradle Wrapper is executable
        run: chmod +x gradlew
      - name: Compile and run focused PokéC tests
        id: compile
        run: |
          ./gradlew --no-daemon clean compileJava compileTestJava
          ./gradlew --no-daemon test --tests 'br.com.petrickfaria.minemon.pokec.PokecCatalogTest' --tests 'br.com.petrickfaria.minemon.pokec.PokemonBreedingTest' --tests 'br.com.petrickfaria.minemon.pokec.PokemonSoulConversionTest' --tests 'br.com.petrickfaria.minemon.entity.PokemonProgressionTest'
          ./gradlew --no-daemon build -x test
      - name: Run Minecraft server behavior tests
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          python3 tools/prepare_gametest_world.py
          timeout 480s ./gradlew --no-daemon runGameTestServer
      - name: Validate Rocket villager profession and uniform on the real client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeRocketProfession
          grep -F 'PASS ROCKET CLIENT:' run/client-validation-rocket.txt
      - name: Validate treat and PokéCoin models on the real client
        run: |
          ALSOFT_DRIVERS=null timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeTreats
          grep -F '[TREAT CLIENT] PASS:' run/client-validation-treats.txt
          grep -F 'PokéCoin and Pokébola models, translations, textures, and creative entries loaded' run/client-validation-treats.txt
      - name: Validate Pokémon management screens on the real client
        run: |
          ALSOFT_DRIVERS=null timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokePokemonManagement
          grep -F 'PASS: owned Pokémon status screen, Pokédex header, XP level sync, Seguir/Sentar controls, and registry-backed Black List defaults' run/client-validation-pokemon-management.txt
      - name: Capture runtime API diagnostics
        if: always()
        run: python3 tools/collect_diagnostics.py
      - name: Upload server behavior logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minemon-server-tests
          path: |
            run/logs/
            build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate production nighttime sleep and closed eyes on the real client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          python3 tools/prepare_client_world.py
          timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeSleep
          grep -F 'PASS NIGHT CLIENT:' run/client-validation-night.txt
      - name: Validate requested bird and ghost flight on the real client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          python3 tools/prepare_client_world.py
          timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeAir -PclientSmokeSpecies=pidgey,spearow,fearow,gastly,haunter,gengar
          grep -F 'PASS ROSTER' run/client-validation.txt
          grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
          cp run/client-validation.txt run/client-validation-requested-flight.txt
      - name: Observe Haunter production patrol without forced movement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          python3 tools/prepare_client_world.py
          timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokePatrol
          grep -F 'PASS HAUNTER PATROL:' run/client-validation-patrol.txt
      - name: Validate Gyarados near-surface animation on the real client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          python3 tools/prepare_client_world.py
          timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeWater -PclientSmokeSpecies=gyarados
          grep -F 'PASS ROSTER' run/client-validation.txt
          grep -F 'PASS gyarados: idle/walk' run/client-validation.txt
          grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
      - name: Launch Minecraft client and validate GeckoLib cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite && success() && steps.compile.outcome == 'success' }}
        run: |
          python3 tools/prepare_client_world.py
          mkdir -p run/config/minemon/sounds/001_Bulbasaur
          cp src/test/resources/audio/synthetic.ogg run/config/minemon/sounds/001_Bulbasaur/ci-synthetic.ogg
          set +e
          ALSOFT_DRIVERS=null timeout --kill-after=30s 5400s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeAudio
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 0 ]; then
            if [ "$smoke_status" -eq 124 ]; then
              echo "[CLIENT SMOKE] FAIL timeout after 5400s; last phase and species progress follow."
            else
              echo "[CLIENT SMOKE] FAIL exit=$smoke_status; no automatic full-client retry will be started."
            fi
            tail -n 120 run/client-validation.txt 2>/dev/null || true
            tail -n 160 run/logs/latest.log 2>/dev/null || true
            exit "$smoke_status"
          fi
          grep -F 'PASS WORLD' run/client-validation.txt
          grep -F 'PASS COMBAT' run/client-validation.txt
          grep -F 'PASS CUSTOM AUDIO' run/client-validation.txt
          grep -F 'PASS LOCOMOTION' run/client-validation.txt
          grep -F 'PASS ROSTER' run/client-validation.txt
          grep -F 'PASS CHARMANDER TAIL FLAME' run/client-validation.txt
          grep -F 'PASS CHARMELEON TAIL FLAME' run/client-validation.txt
          grep -F 'PASS CHARIZARD TAIL FLAME' run/client-validation.txt
          grep -F 'PASS PONYTA/RAPIDASH FIRE OVERLAYS' run/client-validation.txt
          grep -F 'PASS EMISSIVE FIRE' run/client-validation.txt
          grep -F 'PASS FIRE-STARTER ARMS' run/client-validation.txt
          grep -F 'PASS PIDGE WINGS' run/client-validation.txt
          grep -F 'PASS SOURCE LOOK' run/client-validation.txt
          grep -F 'PASS SOURCE PITCH' run/client-validation.txt
          grep -F 'PASS SOURCE PITCH: mew source q.pitch_tilt input moves the body bone:' run/client-validation.txt
          grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
      - name: Validate mixed flight and Vaporeon swimming on the real client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          cp run/client-validation.txt run/client-validation-full.txt
          for scenario in air water; do
            python3 tools/prepare_client_world.py
            if [ "$scenario" = air ]; then
              timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeAir -PclientSmokeSpecies=charizard,scyther,dragonite,articuno,zapdos,moltres,fearow,spearow,pidgey,pidgeotto,pidgeot,zubat,golbat,venomoth,gastly,aerodactyl,mewtwo,mew
            else
              timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeWater -PclientSmokeSpecies=vaporeon
            fi
            grep -F 'PASS ROSTER' run/client-validation.txt
            grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
            cp run/client-validation.txt "run/client-validation-$scenario.txt"
          done
      - name: Verify executable mod JAR contents
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'Minemon-1.19.2-*-all.jar' -print -quit)"
          test -n "$jar_file"
          python3 tools/verify_treats.py "$jar_file"
          jar tf "$jar_file" | grep -Fx 'assets/minemon/models/item/grass_treat.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon/textures/item/grass_treat.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/rattata_rocket.png'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/menu/RocketTradeMenu.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/menu/RocketTradeScreen.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/registry/RocketChallengeManager.class'
          python3 tools/verify_poke_coin.py "$jar_file"
          python3 tools/verify_pokeball.py "$jar_file"
          jar tf "$jar_file" | grep -Fx 'assets/minemon/models/item/pokeball.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon/textures/item/pokeball.png'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/item/PokeballItem.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/pokec/PokemonSoulConversion.class'
          jar tf "$jar_file" | grep -Fx 'assets/minemon/models/item/poke_coin.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon/textures/item/poke_coin.png'
          jar tf "$jar_file" | grep -Fx 'META-INF/ASSET_LICENSES.md'
          jar tf "$jar_file" | grep -Fx 'pack.mcmeta'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/Minemon.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/block/PokecBlock.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/pokec/PokecTransactions.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/menu/PokecScreen.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/block/RocketBlock.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/registry/ModVillagers.class'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/blockstates/rocket_block.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/block/rocket_block.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/item/rocket_block.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/block/rocket_front.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/entity/villager/profession/rocket.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/entity/villager/profession/rocket.png.mcmeta'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/entity/zombie_villager/profession/rocket.png'
          jar tf "$jar_file" | grep -Fx 'data/minemon_gen1/loot_tables/blocks/rocket_block.json'
          jar tf "$jar_file" | grep -Fx 'data/minecraft/tags/point_of_interest_type/acquirable_job_site.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/entity/zombie_villager/profession/rocket.png.mcmeta'
          jar tf "$jar_file" | grep -Fx 'data/minemon_gen1/pokec_species.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/blockstates/pokec.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/block/pokec_lower.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/block/pokec_upper.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/block/pokec_lower.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/block/pokec_upper.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/item/grass_soul.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/item/grass_soul.png'
          jar tf "$jar_file" | grep -Fx 'data/minemon/species_catalog.json'
          jar tf "$jar_file" | grep -Fx 'data/minemon_gen1/pokedex.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/bulbasaur_cobblemon_1_8_2/bulbasaur.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/bulbasaur_cobblemon_1_8_2/bulbasaur.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/bulbasaur_cobblemon_1_8_2/bulbasaur.animation.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/models/item/bulbasaur_spawn_egg.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/lapras_cobblemon_1_8_2/lapras.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/lapras_cobblemon_1_8_2/lapras.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/lapras_cobblemon_1_8_2/lapras.animation.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/geo/aerodactyl_cobblemon_1_8_2/aerodactyl.geo.json'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/textures/pokemon/moltres_cobblemon_1_8_2/moltres.png'
          jar tf "$jar_file" | grep -Fx 'assets/minemon_gen1/animations/dragonair_cobblemon_1_8_2/dragonair.animation.json'
          python3 tools/verify_runtime.py "$jar_file"
          python3 tools/verify_rocket.py "$jar_file"
          python3 tools/verify_batch8.py "$jar_file"
          python3 tools/verify_batch9.py "$jar_file"
          python3 tools/verify_batch10.py "$jar_file"
          python3 tools/verify_batch11.py "$jar_file"
          python3 tools/verify_batch12.py "$jar_file"
          python3 tools/verify_batch13.py "$jar_file"
          python3 tools/verify_batch14.py "$jar_file"
          python3 tools/verify_batch15.py "$jar_file"
          python3 tools/verify_batch16.py "$jar_file"
          python3 tools/verify_pidge_wing_visibility.py "$jar_file"
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'modId="minemon_gen1"'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'versionRange="[1.19.2,1.20)"'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'modId="geckolib3"'
          unzip -p "$jar_file" META-INF/ASSET_LICENSES.md | grep -F 'CC BY-NC 3.0'
          unzip -p "$jar_file" assets/minemon_gen1/models/item/bulbasaur_spawn_egg.json | grep -F 'minecraft:item/template_spawn_egg'
          unzip -p "$jar_file" assets/minemon_gen1/lang/pt_br.json | grep -F '"block.minemon_gen1.rocket_block": "Bloco Rocket"'
          unzip -p "$jar_file" pack.mcmeta | grep -F '"pack_format": 9'
      - name: Upload Minemon JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minemon-1.19.2-2.1.0-gen1
          path: build/libs/Minemon-1.19.2-*-all.jar
          if-no-files-found: error
          retention-days: 14
      - name: Collect diagnostics
        if: always()
        run: python3 tools/collect_diagnostics.py
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minemon-test-diagnostics
          path: |
            run/logs/
            run/client-validation*.txt
            run/screenshots/
            build/test-results/
            build/diagnostics/
          retention-days: 7
