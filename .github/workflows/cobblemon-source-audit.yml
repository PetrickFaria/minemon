name: Audit remaining batch 4 procedural source
on:
  push:
    paths: ['.github/workflows/cobblemon-source-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact audited source archive
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,json,io,subprocess
          from pathlib import Path
          url='https://cdn.modrinth.com/data/MdwFAVRL/versions/GJ2a1b8O/Cobblemon-fabric-1.8.2%2B1.21.1.jar'
          raw=urllib.request.urlopen(url).read()
          assert hashlib.sha256(raw).hexdigest()=='cae8ac328b61354fbe415208b8c6ffc12e7155094d0a87082e85e7914fb380c2'
          z=zipfile.ZipFile(io.BytesIO(raw))
          Path('/tmp/cobblemon-reference.jar').write_bytes(raw)
          for p in z.namelist():
            if p.endswith('.class') and any(s in p.lower() for s in ('nidoqueen','nidorino')):
              print('SOURCE_CLASS',p,flush=True)
              result=subprocess.run(['javap','-c','-p','-classpath','/tmp/cobblemon-reference.jar',p[:-6].replace('/','.')],capture_output=True,text=True,check=True)
              print(result.stdout,flush=True)
          PY
