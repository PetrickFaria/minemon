# Audits native animation and animated texture resolver metadata alongside source art.
name: Audit Cobblemon visual assets and Mew source
on:
  push:
    paths: ['.github/workflows/cobblemon-source-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact source archive without executing its code
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,json,io,subprocess,base64
          from pathlib import Path
          url='https://cdn.modrinth.com/data/MdwFAVRL/versions/GJ2a1b8O/Cobblemon-fabric-1.8.2%2B1.21.1.jar'
          raw=urllib.request.urlopen(url,timeout=120).read()
          assert hashlib.sha256(raw).hexdigest()=='cae8ac328b61354fbe415208b8c6ffc12e7155094d0a87082e85e7914fb380c2'
          z=zipfile.ZipFile(io.BytesIO(raw));members=z.namelist()
          Path('/tmp/cobblemon-reference.jar').write_bytes(raw)
          defs=json.load(open('src/main/resources/data/minemon_gen1/runtime_species.json'))
          for number in [4,5,6,74,75,76,77,78,151]:
            d=defs[number-1]
            slug=d['slug'];folder=f"{d['nationalPokedexNumber']:04d}_{slug}"
            models=[p for p in members if p.startswith(f'assets/cobblemon/bedrock/pokemon/models/{folder}/') and p.endswith('.geo.json')]
            textures=[p for p in members if p.endswith('.png') and f'/{folder}/' in p and '/textures/' in p]
            print('SOURCE',slug,'MODELS',models,'TEXTURES',textures,flush=True)
            for p in models+textures:
              if slug!='mew' and not (slug in ('ponyta','rapidash') and 'fire' in p.lower()):
                continue
              data=base64.b64encode(z.read(p)).decode()
              for i in range(0,len(data),4096):
                print('SOURCE_RESOURCE_PART '+json.dumps({'slug':slug,'path':p,'part':i//4096,'total':(len(data)+4095)//4096,'base64':data[i:i+4096]}),flush=True)
            for p in models:
              geo=json.loads(z.read(p))['minecraft:geometry'][0]
              print('GEOMETRY',slug,p,json.dumps({'description':geo['description'],'bones':[{k:v for k,v in b.items() if k!='cubes'} for b in geo['bones']]}),flush=True)
            posers=[p for p in members if p.startswith(f'assets/cobblemon/bedrock/pokemon/posers/{folder}/') and p.endswith('.json')]
            for p in posers: print('POSER_JSON',slug,z.read(p).decode(),flush=True)
            if slug in ('ponyta','rapidash'):
              resolvers=[p for p in members if '/resolvers/' in p and folder in p and p.endswith('.json')]
              if not resolvers: print('NO_MATCHING_RESOLVER',slug,folder,flush=True)
              for p in resolvers: print('RESOLVER_JSON',slug,p,z.read(p).decode(),flush=True)
            if not posers:
              for p in members:
                if p.endswith('/'+slug.capitalize()+'Model.class'):
                  print('SOURCE_CLASS',slug,p,flush=True)
                  print(subprocess.run(['javap','-c','-p','-classpath','/tmp/cobblemon-reference.jar',p[:-6].replace('/','.')],capture_output=True,text=True,check=True).stdout,flush=True)
            animpath=f'assets/cobblemon/bedrock/pokemon/animations/{folder}/{slug}.animation.json'
            if animpath not in members:
              print('NO_NATIVE_ANIMATION_FILE',slug,animpath,flush=True)
              continue
            animbytes=z.read(animpath)
            data=base64.b64encode(animbytes).decode()
            if slug=='mew':
              for i in range(0,len(data),4096):
                print('SOURCE_RESOURCE_PART '+json.dumps({'slug':slug,'path':animpath,'part':i//4096,'total':(len(data)+4095)//4096,'base64':data[i:i+4096]}),flush=True)
            anims=json.loads(animbytes)['animations']
            if slug=='mew':
              selected=anims
            else:
              selected={name:clip for name,clip in anims.items() if any(token in name for token in ('ground_idle','ground_walk','ground_run','air_idle','air_fly'))}
              selected={name:{**clip,'bones':{bone:channels for bone,channels in clip.get('bones',{}).items() if 'fire' in bone.lower() or 'flame' in bone.lower()}} for name,clip in selected.items()}
            print('ANIMATION_EVIDENCE',slug,json.dumps(selected),flush=True)
          PY
