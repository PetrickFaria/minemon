name: Isolated Minemon GameTest Diagnostics
on:
  push:
    branches: [feature/minemon-natural-behaviors]
  workflow_dispatch:
    inputs:
      selection:
        description: Run one diagnostic GameTest or all three separately
        required: true
        default: all
        type: choice
        options: [all, eevee_sleep, custom_sound, gastly_follow]
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.selection == 'all' || inputs.selection == matrix.selection }}
    name: "GameTest: ${{ matrix.label }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - selection: eevee_sleep
            namespace: minemon_diag_eevee
            label: Eevee ground sleep
          - selection: custom_sound
            namespace: minemon_diag_sound
            label: main-hand custom sound
          - selection: gastly_follow
            namespace: minemon_diag_gastly
            label: Gastly follow altitude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle Wrapper is executable
        run: chmod +x gradlew
      - name: Compile diagnostic GameTests
        run: ./gradlew --no-daemon compileJava processResources
      - name: Prepare GameTest world
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          python3 tools/prepare_gametest_world.py
      - name: Run only the selected diagnostic GameTest
        run: timeout 600s ./gradlew --no-daemon runGameTestServer -PgameTestNamespaces=${{ matrix.namespace }}
      - name: Upload selected GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-diagnostic-${{ matrix.selection }}
          path: |
            run/logs/
            build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
