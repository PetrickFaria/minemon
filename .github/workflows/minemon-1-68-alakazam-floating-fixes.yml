name: Minemon 1.68 Alakazam float fixes
on:
  push:
    branches: [feature/minemon-1.68-alakazam-floating-fixes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify branch scope against approved 1.67 base
        shell: bash
        run: |
          set -euo pipefail
          base=afe5f7db7b24c49e3eb37c6f68984ce2c99bb2bc
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base" HEAD > /tmp/minemon-1.68-files.txt
          cat /tmp/minemon-1.68-files.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/build.yml|.github/workflows/minemon-1-68-alakazam-floating-fixes.yml|build.gradle|gradle.properties|tools/test_world_reopen.py|src/main/java/br/com/petrickfaria/minemon/client/MinemonModel.java|src/main/java/br/com/petrickfaria/minemon/entity/MinemonCreature.java|src/main/java/br/com/petrickfaria/minemon/entity/MinemonFlyingCreature.java|src/main/java/br/com/petrickfaria/minemon/gametest/ClientSmokeTest.java|src/main/resources/assets/minemon/animations/alakazam_cobblemon_1_8_2/alakazam.animation.json|src/test/java/br/com/petrickfaria/minemon/BehaviorCycleTest.java|src/test/java/br/com/petrickfaria/minemon/RequestedBehaviorAssetsTest.java) ;;
              *) echo "Out-of-scope file in 1.68 diff: $path"; exit 1 ;;
            esac
          done < /tmp/minemon-1.68-files.txt
          if rg --pcre2 -n -i 'rcon\.password=(?!\{RCON_PASSWORD\}|\$\{\{)[^$\s]{8,}|(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' $(cat /tmp/minemon-1.68-files.txt); then
            echo 'Possible embedded credential found in changed files.'
            exit 1
          fi
      - name: Compile Java 17 source and focused tests
        run: ./gradlew --no-daemon clean compileJava compileTestJava
      - name: Test Alakazam timing, two full cycles, and meditation asset
        run: ./gradlew --no-daemon test --tests br.com.petrickfaria.minemon.BehaviorCycleTest --tests br.com.petrickfaria.minemon.NaturalBehaviorProfileTest --tests br.com.petrickfaria.minemon.RequestedBehaviorAssetsTest
      - name: Create, save, and reopen Alakazam world twice
        env:
          MINEMON_TEST_RCON_PASSWORD: ${{ secrets.MINEMON_TEST_RCON_PASSWORD }}
        run: |
          if [ -z "$MINEMON_TEST_RCON_PASSWORD" ]; then
            MINEMON_TEST_RCON_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          fi
          export MINEMON_TEST_RCON_PASSWORD
          python3 tools/test_world_reopen.py
      - name: Verify natural hover pose and bob in the Minecraft client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeAir -PclientSmokeAlakazamPose -PclientSmokeSpecies=alakazam
          grep -F 'PASS ALAKAZAM CLIENT POSE:' run/client-validation.txt
          test -f run/screenshots/alakazam-meditation.png
          for reopen in 1 2; do
            ALSOFT_DRIVERS=null timeout --kill-after=30s 600s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeReopen
          done
          test "$(grep -cF 'PASS CLIENT WORLD REOPEN: Alakazam present after reload' run/client-world-reopen-pass.txt)" -eq 2
      - name: Build distributable JAR and verify requested contents
        run: ./gradlew --no-daemon build -x test
      - name: Validate exact JAR name, version, pose, and flight state sync
        shell: bash
        run: |
          set -euo pipefail
          jar_file='build/libs/Minemon-1.19.2-1.68.jar'
          test -f "$jar_file"
          unzip -t "$jar_file"
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/entity/BehaviorCycle.class'
          jar tf "$jar_file" | grep -Fx 'br/com/petrickfaria/minemon/client/MinemonModel.class'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F 'version="1.68"'
          unzip -p "$jar_file" assets/minemon_gen1/animations/alakazam_cobblemon_1_8_2/alakazam.animation.json > /tmp/alakazam-1.68-animation.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/alakazam-1.68-animation.json'))['animations']['animation.alakazam.meditate']['bones']
          expected={'hips','left_upper_leg','left_lower_leg','foot_left','right_upper_leg','right_lower_leg','foot_right'}
          assert set(d)==expected, set(d)
          PY
          unzip -p "$jar_file" br/com/petrickfaria/minemon/entity/MinemonCreature.class | strings | grep -F 'naturalPhaseForRender'
          grep -F 'PASS ALAKAZAM CLIENT POSE:' run/client-validation.txt
          grep -F 'PASS SERVER WORLD SAVE:' run/world-reopen-pass.txt
          test "$(grep -cF 'PASS CLIENT WORLD REOPEN: Alakazam present after reload' run/client-world-reopen-pass.txt)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: Minemon-1.19.2-1.68
          path: |
            build/libs/Minemon-1.19.2-1.68.jar
            run/client-validation.txt
            run/screenshots/alakazam-meditation.png
            run/world-reopen-pass.txt
            run/client-world-reopen-pass.txt
          if-no-files-found: error
          retention-days: 14
