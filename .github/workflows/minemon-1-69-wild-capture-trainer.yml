name: Minemon 1.69 work in progress
on:
  push:
    branches: [feature/minemon-1.69-wild-capture-trainer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify 1.68 base ancestry and credentials
        run: |
          set -euo pipefail
          base=48fec7de785cbc4cc44e5eabe7adaac0e7ee79aa
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          if rg -n -i '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' --glob '!gradlew*' .; then
            echo 'Possible embedded credential found.'
            exit 1
          fi
      - name: Compile Java 17 source and run all unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava compileTestJava
          ./gradlew --no-daemon test
      - name: Run Minecraft GameTests
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          python3 tools/prepare_gametest_world.py
          timeout 600s ./gradlew --no-daemon runGameTestServer
      - name: Create, save, and reopen a Forge world twice
        env:
          MINEMON_TEST_RCON_PASSWORD: ${{ secrets.MINEMON_TEST_RCON_PASSWORD }}
        run: |
          if [ -z "$MINEMON_TEST_RCON_PASSWORD" ]; then
            MINEMON_TEST_RCON_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          fi
          export MINEMON_TEST_RCON_PASSWORD
          python3 tools/test_world_reopen.py
