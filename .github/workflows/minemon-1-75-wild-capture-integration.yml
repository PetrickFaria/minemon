name: Minemon versioned wild capture integration
on:
  push:
    branches: [feature/minemon-1.75-wild-capture-integration]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: minemon-publication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve release version
        run: |
          set -euo pipefail
          version="$(python3 tools/minemon_version.py)"
          echo "MINEMON_VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing candidate: $version"
      - name: Verify PokéCoin reference sprite and heart display rules
        run: |
          python3 tools/verify_poke_coin.py
          test "$(python3 tools/minemon_version.py)" = '1.90'
      - name: Verify both source lines and Java 17 game target
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0a4ac45b9cac824be49857b3fa340c53aec4862d HEAD
          git merge-base --is-ancestor 6f2a94c8391485a1864640916edb62e50809c6bb HEAD
          grep -Fx 'minecraft_version=1.19.2' gradle.properties
          grep -Fx 'forge_version=43.5.0' gradle.properties
          test "$(python3 tools/minemon_version.py)" = "$MINEMON_VERSION"
          if git grep -n -I -E -i '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- . ':!gradlew*'; then
            echo 'Possible embedded credential found.'
            exit 1
          fi
      - name: Compile Java 17 source and run all unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava compileTestJava
          ./gradlew --no-daemon test
      - name: Install native speech library used by client visuals
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y flite1-dev
      - name: Run Minecraft GameTests from both lines
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          python3 tools/prepare_gametest_world.py
          timeout 600s ./gradlew --no-daemon runGameTestServer
      - name: Validate Pokec inventory layout, catalog selection and preview on the real client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeTreats
          grep -F '[TREAT CLIENT] PASS:' run/client-validation-treats.txt
          grep -F 'PASS POKÉC PREVIEW:' run/client-validation-treats.txt
          grep -F 'PASS POKÉC SCROLLBAR:' run/client-validation-treats.txt
          for species in caterpie charmander charizard onix moltres; do
            test -f "run/screenshots/pokec-preview-${species}.png"
          done
      - name: Validate Black List scrollbar on the real client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokePokemonManagement
          grep -F 'PASS BLACKLIST SCROLLBAR:' run/client-validation-pokemon-management.txt
      - name: Validate Rocket offer scrollbar on the real client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeRocketProfession
          grep -F 'PASS ROCKET SCROLLBAR:' run/client-validation-rocket.txt
      - name: Upload Pokec screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: Pokec-interface-visual-check
          path: |
            run/screenshots/pokec-locked.png
            run/screenshots/pokec-unlocked.png
            run/screenshots/pokec-preview-caterpie.png
            run/screenshots/pokec-preview-charmander.png
            run/screenshots/pokec-preview-charizard.png
            run/screenshots/pokec-preview-onix.png
            run/screenshots/pokec-preview-moltres.png
            run/client-validation-treats.txt
          if-no-files-found: error
          retention-days: 7
      - name: Create, save, and reopen capture world twice
        env:
          MINEMON_TEST_RCON_PASSWORD: ${{ secrets.MINEMON_TEST_RCON_PASSWORD }}
        run: |
          if [ -z "$MINEMON_TEST_RCON_PASSWORD" ]; then
            MINEMON_TEST_RCON_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          fi
          export MINEMON_TEST_RCON_PASSWORD
          python3 tools/test_world_reopen.py
      - name: Validate wild capture animation and capture state on the real client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeWildCapture
          grep -F 'PASS WILD CAPTURE CLIENT:' run/wild-capture-client-pass.txt
          for index in 1 2; do
            ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeWildCaptureReopen -PcaptureReopenIndex="$index"
            grep -F "PASS CAPTURE REOPEN $index:" "run/wild-capture-reopen-$index.txt"
          done
      - name: Validate 1.74 ghost visuals and animations in the real client
        run: |
          python3 tools/prepare_client_world.py --ghost-line
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeGhostLine
          grep -F 'PASS GHOST LINE CLIENT:' run/client-validation-ghost-line.txt
          for shot in gastly-front gastly-no-tongue haunter-front-a haunter-front-b haunter-blink gengar-walk gengar-blink gengar-mouth-teeth-fixed gengar-sleep-half-sunk-a gengar-sleep-half-sunk-b; do
            test -f "run/screenshots/ghost-line-1.74-$shot.png"
          done
          for shot in gastly-right gastly-back gastly-left gastly-top gastly-bottom gastly-10-block gastly-25-block gastly-50-block gastly-motion gastly-float; do
            test -f "run/screenshots/ghost-line-1.74-$shot.png"
          done
      - name: Reopen the saved Gastly world and verify aura visibility twice
        run: |
          for index in 1 2; do
            python3 tools/prepare_client_world.py --reuse-world --ghost-line
            ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeGhostLinePersistence -PgastlyReopenIndex="$index"
            grep -F "PASS GASTLY PERSISTENCE REOPEN $index:" "run/gastly-persistence-reopen-$index.txt"
          done
      - name: Validate aquatic swimming poses in the real client
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeWater -PclientSmokeSpecies=golduck,poliwrath,tentacool,tentacruel,seel,dewgong,shellder,cloyster,horsea,seadra,goldeen,seaking,staryu,starmie,magikarp,gyarados,lapras,omanyte,omastar,kabuto,kabutops
          grep -F 'PASS ROSTER' run/client-validation.txt
          grep -F 'ARTICULATION PROFILES:' run/client-validation.txt
      - name: Validate Alakazam pose, two hover cycles, and rendered views
        run: |
          python3 tools/prepare_client_world.py
          ALSOFT_DRIVERS=null timeout --kill-after=30s 900s xvfb-run -a ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G runClient -PclientSmokeTest -PclientSmokeAir -PclientSmokeAlakazamPose -PclientSmokeSpecies=alakazam
          grep -F 'PASS ALAKAZAM CLIENT POSE/CYCLE:' run/client-validation.txt
          test -f run/screenshots/alakazam-1.73-front.png
          test -f run/screenshots/alakazam-1.73-side.png
          test -f run/screenshots/alakazam-1.73-back.png
      - name: Build and verify the versioned Minemon JAR
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | awk 'NR == 1 { print $1 }')" = "$GITHUB_SHA"
          ./gradlew --no-daemon build -x test
          jar_file="build/libs/minemon-${MINEMON_VERSION}.jar"
          test -f "$jar_file"
          unzip -t "$jar_file"
          unzip -p "$jar_file" META-INF/mods.toml | grep -F "version=\"${MINEMON_VERSION}\""
          unzip -p "$jar_file" META-INF/MANIFEST.MF | grep -F "Implementation-Version: ${MINEMON_VERSION}"
          for entry in \
            br/com/petrickfaria/minemon/pokec/WildEncounterManager.class \
            br/com/petrickfaria/minemon/pokec/TrainerProgression.class \
            br/com/petrickfaria/minemon/pokec/TrainerXpLedger.class \
            br/com/petrickfaria/minemon/entity/CaptureBallProjectile.class \
            br/com/petrickfaria/minemon/client/GastlyCoreRenderHook.class \
            br/com/petrickfaria/minemon/entity/GhostLineAnimationRules.class \
            assets/minemon/models/item/pokeball.json \
            assets/minemon/models/item/pokeball_3d.json \
            assets/minemon_gen1/animations/gengar_cobblemon_1_8_2/gengar.animation.json \
            assets/minemon_gen1/animations/alakazam_cobblemon_1_8_2/alakazam.animation.json; do
            jar tf "$jar_file" | grep -Fx "$entry"
          done
          grep -F 'PASS SERVER WORLD SAVE:' run/world-reopen-pass.txt
          grep -F 'PASS WILD CAPTURE CLIENT:' run/wild-capture-client-pass.txt
          grep -F 'PASS GHOST LINE CLIENT:' run/client-validation-ghost-line.txt
          grep -F 'PASS GASTLY PERSISTENCE REOPEN 1:' run/gastly-persistence-reopen-1.txt
          grep -F 'PASS GASTLY PERSISTENCE REOPEN 2:' run/gastly-persistence-reopen-2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Minemon ${{ env.MINEMON_VERSION }}
          path: |
            build/libs/minemon-${{ env.MINEMON_VERSION }}.jar
            run/world-reopen-pass.txt
            run/wild-capture-client-pass.txt
            run/wild-capture-reopen-1.txt
            run/wild-capture-reopen-2.txt
            run/client-validation-ghost-line.txt
            run/gastly-persistence-reopen-1.txt
            run/gastly-persistence-reopen-2.txt
            run/client-validation.txt
            run/screenshots/ghost-line-1.74-*.png
            run/screenshots/alakazam-1.73-*.png
            run/screenshots/wild-capture-*.png
            run/screenshots/*.png
            run/client-validation-treats.txt
            build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Minemon-${{ env.MINEMON_VERSION }}-validation-diagnostics
          path: |
            run/client-validation.txt
            run/logs/**
            run/screenshots/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the version after successful validation and artifact upload
        if: success()
        env:
          RELEASE_VERSION: ${{ env.MINEMON_VERSION }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | awk 'NR == 1 { print $1 }')" = "$GITHUB_SHA"
          tag="minemon-v${RELEASE_VERSION}"
          remote_commit="$(git ls-remote --refs origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_commit" ] && [ "$remote_commit" != "$GITHUB_SHA" ]; then
            # Preserve the historical release ref and identify this reissue by commit.
            tag="minemon-reissue-v${RELEASE_VERSION}-${GITHUB_SHA:0:12}"
            remote_commit="$(git ls-remote --refs origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_commit" ]; then
            test "$remote_commit" = "$GITHUB_SHA"
            echo "Release reference ${tag} already points to this commit."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
