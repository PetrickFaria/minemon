name: Prepare read-only Cobblemon batch source
on:
  push:
    paths: ['tools/import_cobblemon_182_batch.py', '.github/workflows/prepare-cobblemon-batch.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exactly batch 3
        run: python3 tools/import_cobblemon_182_batch.py --batch 3
      - name: Verify resources
        run: python3 tools/verify_project.py
      - name: Emit public asset contents for connector publication
        run: |
          python3 - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','--modified','--others','--exclude-standard']).decode().splitlines()
          for p in paths:
            assert p.startswith(('src/main/resources/assets/minemon/','src/main/resources/data/minemon_gen1/','docs/animation-audit/minemon-gen1-batch'))
            print('MINEMON_ASSET '+json.dumps({'path':p,'base64':base64.b64encode(Path(p).read_bytes()).decode()}))
          PY
