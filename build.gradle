plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

group = 'br.com.petrickfaria.minemon'
version = mod_version
base { archivesName = 'Minemon-1.19.2' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { minemon { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'minemon' }
        server { args '--nogui' }
    }
}

repositories {
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.19:3.1.40')
}

jar {
    manifest { attributes([
        'Specification-Title': 'Minemon',
        'Specification-Vendor': 'PetrickFaria',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'PetrickFaria'
    ]) }
}

jar.finalizedBy('reobfJar')
