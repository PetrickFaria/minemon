plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.77'
}

group = 'br.com.petrickfaria.minemon'
version = mod_version
base { archivesName = 'Minemon-1.19.2' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def runtimeSpecies = (findProperty('runtime_species') ?: 'bulbasaur')
        .toString().split(',').collect { it.trim().toLowerCase(Locale.ROOT) }.findAll { !it.isEmpty() }

// GeckoLib 3 indexes animation JSON from every namespace during resource reload.
// Keep non-registered species' extracted assets in source, but out of the runtime
// JAR so unimplemented/unsupported event tracks cannot break Bulbasaur's cache.
def speciesAssetRoots = [
    'assets/minemon/geo/',
    'assets/minemon/animations/',
    'assets/minemon/textures/pokemon/',
    'assets/minemon/sounds/pokemon/',
    'assets/minemon/licenses/pokemon/'
]
def runtimeManifestFile = file('src/main/resources/data/minemon/runtime_species.json')
def runtimeDefinitions = runtimeManifestFile.exists() ? new groovy.json.JsonSlurper().parse(runtimeManifestFile) : []
def runtimeAssetFiles = runtimeDefinitions.collectMany { d -> [d.model,d.texture,d.animation] + d.sounds + d.licenses }.toSet()
processResources {
    doLast {
        exec { commandLine 'python3', 'tools/prepare_runtime_assets.py', destinationDir.absolutePath }
    }
    exclude { details ->
        if (details.isDirectory()) return false
        def root = speciesAssetRoots.find { details.path.startsWith(it) }
        if (root == null) return false
        if (!runtimeAssetFiles.isEmpty()) return !runtimeAssetFiles.contains(details.path)
        def relative = details.path.substring(root.length())
        def species = relative.tokenize('/').find()
        return species == null || !runtimeSpecies.contains(species)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { minemon { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'minemon'
            property 'minemon.clientSmokeTest', project.hasProperty('clientSmokeTest').toString()
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'minemon' }
    }
}

repositories {
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'junit:junit:4.13.2'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.19:3.1.40')
}

jar {
    exclude 'br/com/petrickfaria/minemon/gametest/**'
    exclude 'data/minemon/structures/test_arena.nbt'
    from('ASSET_LICENSES.md') {
        into 'META-INF'
    }
    manifest { attributes([
        'Specification-Title': 'Minemon',
        'Specification-Vendor': 'PetrickFaria',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'PetrickFaria'
    ]) }
}

jar.finalizedBy('reobfJar')

test {
    dependsOn processResources
    systemProperty 'minemon.testResources', processResources.destinationDir.absolutePath
}
