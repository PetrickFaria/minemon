plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.77'
}

group = 'br.com.petrickfaria.minemon'
version = mod_version
base { archivesName = 'Minemon-1.19.2' }

configurations {
    library
    implementation.extendsFrom library
}
jarJar.enable()

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def runtimeSpecies = (findProperty('runtime_species') ?: 'bulbasaur')
        .toString().split(',').collect { it.trim().toLowerCase(Locale.ROOT) }.findAll { !it.isEmpty() }
def runtimeManifestFile = file('src/main/resources/data/minemon_gen1/runtime_species.json')
def runtimeDefinitions = runtimeManifestFile.exists() ? new groovy.json.JsonSlurper().parse(runtimeManifestFile) : []

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
    includeEmptyDirs = false
    // Source art stays under assets/minemon for provenance. The selected species
    // are copied into the independent generation namespace below.
    exclude 'assets/minemon/**'
    doLast {
        def sourceRoot = file('src/main/resources')
        def destinationRoot = destinationDir
        def assetPrefix = 'assets/minemon/'
        def sourceFireFrames = ['ponyta','rapidash'].collectMany { slug -> (1..4).collect { frame -> "assets/minemon/textures/pokemon/${slug}_cobblemon_1_8_2/fire/normal/${frame}.png" } }
        // Pokémon recordings remain in the source archive for provenance, but are never
        // copied into the distributable JAR. User-provided files live under config/minemon.
        def runtimePaths = runtimeDefinitions.collectMany { d -> [d.model,d.texture] + ((d.generated_static_animation && !new File(sourceRoot,d.animation).isFile()) ? [] : [d.animation]) + d.licenses + (d.flame_texture ? [d.flame_texture] : []) }.unique() + sourceFireFrames
        runtimePaths = runtimePaths.unique()
        runtimeDefinitions.each { d -> runtimePaths << "assets/minemon/models/item/${d.slug}_spawn_egg.json" }
        runtimePaths.unique().each { path ->
            if (!path.startsWith(assetPrefix)) throw new GradleException("Unexpected source asset path: ${path}")
            def source = new File(sourceRoot, path)
            if (!source.isFile()) throw new GradleException("Missing selected runtime asset: ${path}")
            def targetPath = 'assets/minemon_gen1/' + path.substring(assetPrefix.length())
            def target = new File(destinationRoot, targetPath)
            target.parentFile.mkdirs()
            target.bytes = source.bytes
        }
        // The treat and coin items use their own minemon registry namespace, while the rest
        // of the mod's source assets are repackaged as minemon_gen1.
        def customItemIds = ['aquatic_treat','bug_treat','dragon_treat','electric_treat','fairy_treat',
                        'fighting_treat','fire_treat','flying_treat','frozen_treat','ghost_treat',
                        'ground_treat','normal_treat','poison_treat','psychic_treat','rock_treat','steel_treat',
                        'poke_coin','pokeball']
        customItemIds.each { id ->
            ['models/item/' + id + '.json', 'textures/item/' + id + '.png'].each { relativePath ->
                def path = assetPrefix + relativePath
                def source = new File(sourceRoot, path)
                if (!source.isFile()) throw new GradleException("Missing Pokémon treat asset: ${path}")
                def target = new File(destinationRoot, path)
                target.parentFile.mkdirs()
                target.bytes = source.bytes
            }
        }
        ['en_us.json','pt_br.json'].each { name ->
            def source = new File(sourceRoot, "assets/minemon/lang/${name}")
            def target = new File(destinationRoot, "assets/minemon_gen1/lang/${name}")
            target.parentFile.mkdirs()
            def language = new groovy.json.JsonSlurper().parse(source)
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(language)) + '\n'
        }
        ['en_us.json','pt_br.json'].each { name ->
            def source = new File(sourceRoot, "assets/minemon/lang/${name}")
            def language = new groovy.json.JsonSlurper().parse(source)
            def treatTranslations = [:]
            language.each { key, value -> if (key.startsWith('item.minemon.')) treatTranslations[key] = value }
            def target = new File(destinationRoot, "assets/minemon/lang/${name}")
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(treatTranslations)) + '\n'
        }
        exec { commandLine 'python3', 'tools/prepare_runtime_assets.py', destinationDir.absolutePath }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            jvmArgs '-Xmx2G'
            forceExit false
            property 'forge.logging.console.level', 'info'
            lazyToken('minecraft_classpath') {
                configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
            }
            mods { minemon_gen1 { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'minemon_gen1'
            property 'minemon.clientSmokeTest', project.hasProperty('clientSmokeTest').toString()
            property 'minemon.clientSmokePatrol', project.hasProperty('clientSmokePatrol').toString()
            property 'minemon.clientSmokeSleep', project.hasProperty('clientSmokeSleep').toString()
            property 'minemon.clientSmokeAir', project.hasProperty('clientSmokeAir').toString()
            property 'minemon.clientSmokeWater', project.hasProperty('clientSmokeWater').toString()
            property 'minemon.clientSmokeAudio', project.hasProperty('clientSmokeAudio').toString()
            property 'minemon.clientSmokeRocketProfession', project.hasProperty('clientSmokeRocketProfession').toString()
            property 'minemon.clientSmokeTreats', project.hasProperty('clientSmokeTreats').toString()
            property 'minemon.clientSmokeSpecies', (findProperty('clientSmokeSpecies') ?: '').toString()
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'minemon_gen1' }
    }
}

repositories {
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'junit:junit:4.13.2'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.19:3.1.40')
    library(group: 'javazoom', name: 'jlayer', version: '1.0.1') {
        jarJar.pin(it, '1.0.1')
    }
    jarJar(group: 'javazoom', name: 'jlayer', version: '[1.0.1,1.0.2)') {
        jarJar.pin(it, '1.0.1')
    }
    def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def lwjglNatives = osName.contains('win') ? 'natives-windows'
            : osName.contains('mac') ? (osArch.contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos')
            : (osArch.contains('aarch64') ? 'natives-linux-arm64' : 'natives-linux')
    testRuntimeOnly "org.lwjgl:lwjgl:3.3.1:${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-stb:3.3.1:${lwjglNatives}"
}

jar {
    exclude 'br/com/petrickfaria/minemon/gametest/**'
    exclude 'data/minemon_gen1/structures/test_arena.nbt'
    from('ASSET_LICENSES.md') {
        into 'META-INF'
    }
    from('licenses/JLAYER-LGPL-2.1.txt') {
        into 'META-INF'
        rename { 'LICENSE-JLAYER-LGPL-2.1.txt' }
    }
    manifest { attributes([
        'Specification-Title': 'Minemon',
        'Specification-Vendor': 'PetrickFaria',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'PetrickFaria'
    ]) }
}

jar.finalizedBy('reobfJar')
// ForgeGradle produces the executable Jar-in-Jar artifact as a separate task.
// Include it in assemble so build outputs the JLayer-bearing production JAR.
tasks.named('jarJar') {
    finalizedBy('reobfJarJar')
    exclude 'br/com/petrickfaria/minemon/gametest/**'
    exclude 'data/minemon_gen1/structures/test_arena.nbt'
    from('ASSET_LICENSES.md') {
        into 'META-INF'
    }
    from('licenses/JLAYER-LGPL-2.1.txt') {
        into 'META-INF'
        rename { 'LICENSE-JLAYER-LGPL-2.1.txt' }
    }
}
tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
}

test {
    dependsOn processResources
    systemProperty 'minemon.testResources', processResources.destinationDir.absolutePath
}
